plugins {
    id 'com.android.application'
}

// GitHub Actions sets VERSION_CODE so every build installs as an update.
def code = (System.getenv('VERSION_CODE') ?: '1') as int

android {
    namespace 'xyz.jainovation.codedrop'
    compileSdk 35

    defaultConfig {
        applicationId 'xyz.jainovation.codedrop'
        minSdk 21
        targetSdk 35
        versionCode code
        versionName "1.0.${code}"
    }

    // The signing key is part of the project, so builds need no setup. Every build uses the same key,
    // which keeps updates installable and matches .well-known/assetlinks.json on the website.
    signingConfigs {
        release {
            storeFile file('codedrop-signing.jks')
            storePassword 'codedrop'
            keyAlias 'codedrop'
            keyPassword 'codedrop'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Opens the website in a Trusted Web Activity: full Chrome (camera, downloads, QR scanning) without a URL bar.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.2.0'
    // The helper above pulls in androidx.browser 1.3.0, which crashes on start on Android 12+
    // (PendingIntent created without FLAG_IMMUTABLE). Pinning a fixed version overrides it.
    implementation 'androidx.browser:browser:1.8.0'
}

# Builds the Codedrop APK on GitHub and publishes it under Releases. No setup or secrets needed.
# Runs by itself when anything in android/ changes, or from the Actions tab with "Run workflow".
name: Build Android app (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk codedrop.apk

      - name: Publish it under Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Codedrop app (build ${{ github.run_number }})
          body: Download codedrop.apk and open it on an Android phone to install.
          files: codedrop.apk
